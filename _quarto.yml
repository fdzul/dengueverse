            href: https://fdzul.github.io/denguedatasets/
          - text: denguedatasets-py (Python)
            href: https://fdzul.github.io/denguedatasets-py/
          - text: ewarsmx
            href: https://github.com/fdzul/ewarsmx
          - text: climex (Python)
            href: https://github.com/fdzul/climex
      - text: Surveillance
        menu:
